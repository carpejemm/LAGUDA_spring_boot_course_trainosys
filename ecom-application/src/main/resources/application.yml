#spring.application.name=ecom-application
#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test
# spring.jpa.show-sql=true
# spring.jpa.hibernate.ddl-auto=create
spring:
  application:
    name: ecom-application
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create

app:
  jwt:
    # Base64-encoded 256-bit key used to sign tokens (HS256). In real projects, load it from an environment variable.
    secret: uQWPfzkl5zA79y9YdFZtwXL2dXcKsp7lUh4p4FrcFFM=
    # 24 hours
    expiration-ms: 86400000
    # Name of the HttpOnly cookie that carries the JWT
    cookie-name: trainosys-jwt
